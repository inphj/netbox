name: 자동 머지

# PR 검증이 끝나면 그 커밋의 체크가 **전부** 초록인지 보고 머지한다 — 사람 PR 도 포함(사용자 결정 2026-09-13).
# Free org 라 GitHub 보호 규칙이 없어 이 워크플로가 그 역할이다. 그만큼 PR 체크를 믿어야 한다.
#
# 함정 둘:
#   - GITHUB_TOKEN 이 한 머지는 push 이벤트를 안 만들어 deploy.yml 이 안 돈다. 그래서 머지 뒤
#     deploy.yml 을 workflow_dispatch 로 직접 부른다(그건 GITHUB_TOKEN 으로도 허용된다).
#   - workflow_run 워크플로는 **main 에 있는 판**이 돈다. PR 에서 이 파일을 고쳐도 머지 전엔 안 바뀐다.
#     처음 넣는 PR 은 사람이 머지해야 한다.

on:
  workflow_run:
    workflows: ["포크 검증"]
    types: [completed]

concurrency:
  group: auto-merge          # 머지·배포 호출을 한 번에 하나씩. 순서가 섞이면 배포 기준 커밋이 어긋난다
  cancel-in-progress: false

permissions:
  contents: write            # 머지·브랜치 삭제
  pull-requests: write       # 머지
  actions: write             # deploy.yml workflow_dispatch
  checks: read

jobs:
  # 작업 ID 는 ASCII 만 된다(pr.yml 주석 참고). 이 잡의 보이는 이름 "머지"는 아래 스크립트가
  # 체크 목록에서 자기 자신을 빼는 데 쓴다 — 바꾸면 스크립트도 같이.
  merge:
    name: 머지
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const sha = run.head_sha;
            const { owner, repo } = context.repo;
            const ME = '머지';
            // 1. 이 커밋의 PR. 포크에서 온 PR 은 pull_requests 가 비어 여기서 걸러진다.
            const prs = run.pull_requests || [];
            if (!prs.length) { core.info('PR 없음(포크이거나 이미 닫힘) - 아무것도 안 함'); return; }
            for (const p of prs) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: p.number });
              if (pr.state !== 'open' || pr.draft || pr.base.ref !== 'main' || pr.head.sha !== sha) {
                core.info(`#${pr.number} 건너뜀: state=${pr.state} draft=${pr.draft} base=${pr.base.ref} head일치=${pr.head.sha === sha}`);
                continue;
              }
              // 2. 그 커밋의 체크 전부 - 이 잡 자신은 뺀다. 하나라도 미완·실패면 안 한다.
              const { data: cr } = await github.rest.checks.listForRef({ owner, repo, ref: sha, per_page: 100 });
              const others = cr.check_runs.filter(c => c.name !== ME);
              const bad = others.filter(c => c.status !== 'completed' || !['success', 'neutral', 'skipped'].includes(c.conclusion));
              const verified = others.some(c => c.name === '포크 규칙' && c.conclusion === 'success');
              if (!verified || bad.length) {
                core.setFailed(`#${pr.number} 머지 안 함: 검증통과=${verified} 미완·실패=${bad.map(c => c.name + ':' + (c.conclusion || c.status)).join(',') || '없음'}`);
                continue;
              }
              // 3. 머지. mergeable 은 GitHub 이 뒤늦게 계산하므로 잠깐 기다린다.
              let m = pr;
              for (let i = 0; i < 5 && m.mergeable === null; i++) {
                await new Promise(r => setTimeout(r, 3000));
                m = (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data;
              }
              if (m.mergeable === false) { core.setFailed(`#${pr.number} 충돌 - 머지 안 함`); continue; }
              const res = await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'merge', sha });
              core.info(`#${pr.number} 머지 → ${res.data.sha}`);
              try { await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` }); }
              catch (e) { core.info('브랜치 삭제 실패(무시): ' + e.message); }
              // 4. 배포 호출 - GITHUB_TOKEN 머지는 push 이벤트를 안 낸다. deploy.yml 이 없는 저장소는 건너뛴다.
              try {
                await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'deploy.yml', ref: 'main' });
                core.info('deploy.yml 호출(main)');
              } catch (e) {
                if (e.status === 404) core.info('deploy.yml 없음 - 배포 호출 생략'); else throw e;
              }
            }
