name: 포크 검증

# 이 저장소는 netbox-community/netbox 의 포크다. 업스트림 워크플로(ci.yml 등)는 GitHub 호스트
# 러너에서 그대로 돈다(공개 저장소라 무료). 이 파일은 그것과 별개로 **포크 규칙**만 잡는다:
#   1. 바뀐 .py 가 컴파일되는가 (전체 컴파일은 저장소가 커서 바뀐 파일만)
#   2. 포크의 코어(netbox/)를 고쳤으면 LOCAL-CHANGES.md 도 같이 고쳤는가
#      - 업스트림을 병합하는 PR 은 이 규칙에서 뺀다. 그건 우리 변경이 아니다. 판정은 "머지 커밋의 둘째 부모가
#        origin/main 밖(=업스트림)인가" 로 한다 - main 을 feature 에 병합만 한 PR 은 예외가 아니다
#        (NetBox 세션 지적 2026-09-13: 머지 커밋 유무만 보면 그런 PR 에서 규칙이 조용히 꺼진다).
#      - netbox/netbox_oci, netbox/netbox_cloudinv 는 코어가 아니라 플러그인의 구식 사본이라 뺀다
#        (실측 2026-09-13: 포크와 v4.7.0 의 차이는 이 두 디렉터리 + LOCAL-CHANGES.md 뿐. 빌드는
#        infra-opensource 의 플러그인을 복사해 덮으므로 이 사본은 이미지에 안 들어간다).
# 이 포크는 **공개** 저장소다. org 의 자체 러너 그룹은 기본으로 공개 저장소를 받지 않아(2026-09-13 실측:
# 잡이 20분 넘게 queued) 여기서는 GitHub 호스트 러너를 쓴다 - 공개 저장소는 무료고, 남의 코드를 홈랩
# 노드에서 돌리지 않는 쪽이 맞다. 자체 러너(arc-ci)는 비공개 저장소들(infra-gitops·infra-opensource·infra-docs)용이다.

on:
  pull_request:
    branches: [main]

concurrency:
  group: fork-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fork_rules:
    name: 포크 규칙
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 바뀐 .py 컴파일
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          mapfile -t files < <(git diff --name-only --diff-filter=AM "$base" HEAD -- '*.py')
          echo "바뀐 .py: ${#files[@]}개"
          [ "${#files[@]}" = 0 ] || python3 -m py_compile "${files[@]}"

      - name: 코어를 고쳤으면 LOCAL-CHANGES.md 도 고쳤는가
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          for m in $(git log --merges --format=%H "$base..HEAD"); do
            p2=$(git rev-parse "$m^2")
            if ! git merge-base --is-ancestor "$p2" origin/main; then
              echo "업스트림을 끌어오는 머지 커밋 $m (둘째 부모 ${p2:0:7} 가 origin/main 밖) - LOCAL-CHANGES 규칙 생략"; exit 0
            fi
          done
          changed=$(git diff --name-only "$base" HEAD)
          core=$(echo "$changed" | grep -E '^netbox/' \
                 | grep -vE '^netbox/(translations|netbox_oci|netbox_cloudinv)/' || true)
          if [ -z "$core" ]; then echo "코어 변경 없음"; exit 0; fi
          echo "$changed" | grep -qx 'LOCAL-CHANGES.md' && { echo "LOCAL-CHANGES.md 갱신됨"; exit 0; }
          echo "NG: 코어 파일이 바뀌었는데 LOCAL-CHANGES.md 가 안 바뀌었다. 포크 원칙: 바꿀 때마다 한 항목씩, 되돌리는 법까지."
          echo "$core" | sed 's/^/  /'
          exit 1
